services:
  postgres:
    image: postgres:16-alpine
    container_name: adama_hotel_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: adama
      POSTGRES_PASSWORD: adama_secret_2024
      POSTGRES_DB: adama_hotel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adama -d adama_hotel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
